name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - run: bun run build

      - name: Match the extension version to the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' extension/dist/manifest.json > manifest.tmp
          mv manifest.tmp extension/dist/manifest.json

      - name: Zip the extension
        run: cd extension/dist && zip -r "../../tether-${GITHUB_REF_NAME}.zip" .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "tether-${GITHUB_REF_NAME}.zip" \
            --title "Tether ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
